# Runs the starter/ Playwright project: typecheck, API suite, then UI suite.
# Any failing step fails the job; evidence is uploaded in separate steps that
# never replace the test result.
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: API tests (DummyJSON)
        run: npx playwright test --project=api

      - name: UI tests (SauceDemo)
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: starter/playwright-report/
          retention-days: 30

      - name: Upload test results (traces, screenshots)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: starter/test-results/
          if-no-files-found: ignore
          retention-days: 30
