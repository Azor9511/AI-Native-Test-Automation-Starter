# Keeps the Starter Kit itself healthy: runs both environment
# validators so broken scripts or docs drift are caught before
# students hit them.
name: Validate Starter Kit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-environment:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          # - macos-latest
          # Disabled: hosted macOS runners do not provision for
          # private repos on the free plan — jobs sit queued ~15 min
          # then get cancelled, failing the run. Re-enable when the
          # repo goes public or the account upgrades; Ubuntu covers
          # the same .sh logic meanwhile (GNU vs BSD differences are
          # minimal in this script).
    steps:
      - uses: actions/checkout@v4

      - name: Run bash validator
        if: runner.os != 'Windows'
        run: bash scripts/verify-environment.sh

      - name: Run PowerShell validator
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-environment.ps1
