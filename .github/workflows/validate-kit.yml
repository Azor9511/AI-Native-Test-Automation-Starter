# Keeps the Starter Kit itself healthy: runs both environment
# validators on every supported platform so broken scripts or docs
# drift are caught before students hit them.
name: Validate Starter Kit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-environment:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
        # macos-13 (Intel) instead of macos-latest: the Apple Silicon
        # pool is frequently unavailable for private repos on free
        # plans — jobs sit queued until cancelled. Switch back to
        # macos-latest if the repo goes public or the account is on a
        # paid plan.
        os: [windows-latest, macos-13, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run bash validator
        if: runner.os != 'Windows'
        run: bash scripts/verify-environment.sh

      - name: Run PowerShell validator
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-environment.ps1
