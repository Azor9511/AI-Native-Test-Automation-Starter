# Keeps the Starter Kit itself healthy: runs both environment
# validators on every supported platform so broken scripts or docs
# drift are caught before students hit them.
name: Validate Starter Kit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-environment:
    name: ${{ matrix.os }}${{ matrix.optional && ' (best-effort)' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required checks — hosted Windows/Linux runners provision
          # reliably on free plans.
          - os: windows-latest
            optional: false
          - os: ubuntu-latest
            optional: false
          # Best-effort: hosted macOS runners are frequently
          # unavailable for private repos on free plans — jobs sit
          # queued ~15 min then get cancelled. Kept so the .sh is
          # still validated on real BSD tools when a runner is
          # available, without ever failing the run. Make it required
          # (optional: false) if the repo goes public.
          - os: macos-latest
            optional: true
    steps:
      - uses: actions/checkout@v4

      - name: Run bash validator
        if: runner.os != 'Windows'
        run: bash scripts/verify-environment.sh

      - name: Run PowerShell validator
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-environment.ps1
